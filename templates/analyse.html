<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyse — Projet Écureuil</title>
  <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='css/style.css') }}">
</head>
<body data-page="analyse">

  <nav class="navbar">
    <a class="navbar__brand" href="main.html">
      <span class="navbar__logo">🐿</span>
      <span class="navbar__title">Projet Écureuil</span>
    </a>
    <button class="navbar__toggle" id="nav-toggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <ul class="navbar__links" id="nav-links">
      <li><a class="nav-link" href="/main-page">Accueil</a></li>
      <li><a class="nav-link" href="/stats-page">Statistiques</a></li>
      <li><a class="nav-link" href="/photos-page">Photos</a></li>
      <li><a class="nav-link" href="/alertes-page">Alertes</a></li>
      <li><a class="nav-link" href="/projets-page">Projet</a></li>
      <li><a class="nav-link" href="/infos-page">Infos</a></li>
    </ul>
  </nav>

  <div class="popup-overlay hidden" id="alert-popup">
    <div class="popup">
      <div class="popup__header">
        <span class="popup__icon">⚠️</span>
        <h2>Alerte sanitaire détectée</h2>
        <button class="popup__close" onclick="closePopup()">✕</button>
      </div>
      <div class="popup__body">
        <p>Un individu potentiellement malade a été identifié.</p>
        <div class="popup__detail">
          <span class="popup__label">Type :</span>
          <span class="badge badge--warning" id="popup-type">—</span>
        </div>
        <div class="popup__detail">
          <span class="popup__label">Date :</span>
          <span id="popup-date">—</span>
        </div>
      </div>
      <div class="popup__footer">
        <button class="btn btn--primary" id="popup-link">Voir la détection</button>
        <button class="btn btn--ghost" onclick="closePopup()">Fermer</button>
      </div>
    </div>
  </div>

  <main class="main-content">
    <div id="analyse-content">
      <p class="loading">Chargement de la détection...</p>
    </div>
  </main>

  <footer class="footer">
    <p>Projet Écureuil — ISEN 2026</p>
  </footer>

  <script type="module"
        src="{{ url_for('static', filename='js/init.js') }}">
  </script>

</body>
</html>
